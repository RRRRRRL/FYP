[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attention-amd-prototype"
version = "0.1.0"
description = "FA3-inspired FlashAttention prototype for AMD ROCm and Triton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "triton>=3.0; platform_system == 'Linux'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
evaluation = ["matplotlib>=3.8"]

[project.scripts]
flash-attention-amd-env = "flash_attention_amd_prototype.environment:main"
flash-attention-amd-probe = "flash_attention_amd_prototype.triton_probe:main"
flash-attention-amd-evaluate = "flash_attention_amd_prototype.evaluation:main"
flash-attention-amd-tune = "flash_attention_amd_prototype.tuning:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rocm: requires an AMD GPU with a PyTorch ROCm build",
    "hardware: executes kernels on an accelerator",
    "slow: long-running validation excluded from routine tests",
    "benchmark: performance or memory measurement",
]
