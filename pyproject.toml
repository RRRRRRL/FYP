[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attention-prototype"
version = "0.1.0"
description = "FlashAttention forward and backward prototype implemented with Triton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "triton>=3.0; platform_system == 'Linux'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
flash-attention-env = "flash_attention_prototype.environment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a CUDA-capable NVIDIA GPU",
    "slow: long-running validation excluded from routine tests",
    "benchmark: performance or memory measurement",
]
